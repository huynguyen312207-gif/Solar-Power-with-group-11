# Số liệu trong báo cáo final.pdf (Bảng 4, 5, 6 và Mục 7.6) để src.evaluate tự đối chiếu.

tolerance:
  exact:      # đánh giá từ checkpoint/dự đoán có sẵn: phải khớp tới chữ số làm tròn trong báo cáo
    r2_abs: 0.00005
    err_abs: 0.005      # kW (RMSE, MAE làm tròn 2 chữ số)
    err_rel: 0.0
  retrain:    # huấn luyện lại từ đầu (CPU/GPU khác, thư viện khác): ngưỡng khai báo ở Mục 9 REPRODUCE.md
    r2_abs: 0.01        # 1 điểm %
    err_abs: 0.0
    err_rel: 0.05       # 5% với RMSE, MAE

